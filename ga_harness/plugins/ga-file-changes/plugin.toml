name = "ga-file-changes"
category = "observe"
entry = "main:apply"
description = "Track the files the agent changes with file_write/file_patch in each run and list them in the transcript when the run ends (files touched only through code_run are not detected)."
description_zh = "\u8ffd\u8e2a\u6bcf\u6b21\u8fd0\u884c\u4e2d Agent \u7528 file_write/file_patch \u4fee\u6539\u7684\u6587\u4ef6\uff0c\u5e76\u5728\u8fd0\u884c\u7ed3\u675f\u65f6\u5217\u5728\u5bf9\u8bdd\u4e2d\uff08\u4ec5\u901a\u8fc7 code_run \u6539\u52a8\u7684\u6587\u4ef6\u65e0\u6cd5\u68c0\u6d4b\uff09\u3002"
inject = ["ga.hooks"]
provides = []

[settings.max_files]
type = "integer"
label = "Maximum files listed per run"
label_zh = "\u6bcf\u6b21\u8fd0\u884c\u6700\u591a\u5217\u51fa\u7684\u6587\u4ef6\u6570"
default = 50
min = 1
max = 1000
