name = "ga-file-changes"
category = "observe"
entry = "main:apply"
description = "Track the files the agent changes with file_write/file_patch in each run and list them, with a diff of each, in the transcript when the run ends (files touched only through code_run are not detected)."
description_zh = "\u8ffd\u8e2a\u6bcf\u6b21\u8fd0\u884c\u4e2d Agent \u7528 file_write/file_patch \u4fee\u6539\u7684\u6587\u4ef6\uff0c\u5e76\u5728\u8fd0\u884c\u7ed3\u675f\u65f6\u8fde\u540c\u6539\u52a8\u5dee\u5f02\u5217\u5728\u5bf9\u8bdd\u4e2d\uff08\u4ec5\u901a\u8fc7 code_run \u6539\u52a8\u7684\u6587\u4ef6\u65e0\u6cd5\u68c0\u6d4b\uff09\u3002"
inject = ["ga.hooks"]
provides = []

[settings.max_files]
type = "integer"
label = "Maximum files listed per run"
label_zh = "\u6bcf\u6b21\u8fd0\u884c\u6700\u591a\u5217\u51fa\u7684\u6587\u4ef6\u6570"
default = 50
min = 1
max = 1000

[settings.max_diff_lines]
type = "integer"
label = "Maximum diff lines shown per file (0 = names only)"
label_zh = "\u6bcf\u4e2a\u6587\u4ef6\u6700\u591a\u663e\u793a\u7684\u5dee\u5f02\u884c\u6570\uff080 = \u53ea\u5217\u6587\u4ef6\u540d\uff09"
default = 400
min = 0
max = 5000

[settings.max_height]
type = "integer"
label = "Height cap of the changed-files list in pixels (0 = no cap; scrolls inside)"
label_zh = "\u4fee\u6539\u6587\u4ef6\u5217\u8868\u7684\u6700\u5927\u9ad8\u5ea6\uff08\u50cf\u7d20\uff0c0 = \u4e0d\u9650\uff0c\u8d85\u51fa\u65f6\u5185\u90e8\u6eda\u52a8\uff09"
default = 420
min = 0
max = 5000

[settings.collapse_after]
type = "integer"
label = "Start the list folded when more files than this changed (0 = always folded)"
label_zh = "\u4fee\u6539\u6587\u4ef6\u6570\u8d85\u8fc7\u6b64\u503c\u65f6\u5217\u8868\u9ed8\u8ba4\u6298\u53e0\uff080 = \u59cb\u7ec8\u6298\u53e0\uff09"
default = 0
min = 0
max = 1000
