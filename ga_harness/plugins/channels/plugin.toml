name = "channels"
category = "service"
entry = "main:apply"
description = "Chat-platform bridge: bind external chats to sessions and route messages through runs. Adapters plug in via the channels service."
description_zh = "聊天平台桥接：把外部聊天绑定到会话，并通过 runs 收发消息。各平台适配器通过 channels 服务接入。"
inject = ["runs", "sessions"]
provides = ["channels", "channel_manager"]

[settings.workspace]
type = "string"
label = "Workspace for new channel sessions (empty = default)"
label_zh = "渠道新会话使用的工作区（留空为默认）"
default = ""
