name = "web-tools-refresh"
category = "ui"
entry = "main:apply"
description = "ui-web \"+\" menu item, enabled while a task runs: the running task's next model call resends GA's full tool definitions, without sending a message (needs ga-tools-refresh)."
description_zh = "ui-web\u300c+\u300d\u83dc\u5355\u9879\uff0c\u4efb\u52a1\u8fd0\u884c\u4e2d\u53ef\u7528\uff1a\u8ba9\u6b63\u5728\u8fd0\u884c\u7684\u4efb\u52a1\u4e0b\u4e00\u6b21\u6a21\u578b\u8c03\u7528\u91cd\u65b0\u5b8c\u6574\u6ce8\u5165 GA \u5de5\u5177\u5b9a\u4e49\uff0c\u4e0d\u53d1\u9001\u6d88\u606f\uff08\u4f9d\u8d56 ga-tools-refresh\uff09\u3002"
inject = ["web.host", "runs"]
workers = ["ga-tools-refresh"]
