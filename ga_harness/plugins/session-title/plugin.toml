name = "session-title"
category = "extension"
entry = "main:apply"
description = "AI session titles: retitle a session from the session list or session menu; optionally auto-title new sessions after the first reply."
description_zh = "AI 生成会话标题：可在会话列表或会话菜单中手动生成；可选开启首轮回复后自动生成。"
inject = ["web.host", "sessions"]

[settings.auto]
type = "boolean"
default = false
label = "Auto-title new sessions"
label_zh = "自动为新会话生成标题"
description = "After the first finished reply, replace the default title (first message) with an AI title. Manually renamed sessions are never touched."
description_zh = "首轮回复完成后，用 AI 标题替换默认标题（首条消息）；手动改过的标题不会被覆盖。"

[settings.model]
type = "choice"
default = ""
options = [{ value = "", label = "Follow current model", label_zh = "跟随当前模型" }]
options_from = "mykey-models"
label = "Title model"
label_zh = "标题模型"
description = "Default model used to write titles. Follow current model uses the session's own model."
description_zh = "生成标题默认使用的模型；跟随当前模型时使用会话自身的模型。"

[settings.timeout]
type = "integer"
default = 60
label = "Timeout (s)"
label_zh = "超时（秒）"
description = "Read timeout of each title request."
description_zh = "每次标题请求的读取超时。"
