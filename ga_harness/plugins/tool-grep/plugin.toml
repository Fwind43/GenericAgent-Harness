name = "tool-grep"
entry = "main:apply"
description = "Read-only regex search tool `grep` registered through ga.tools (example of a harness-owned tool)."
description_zh = "通过 ga.tools 注册的只读正则搜索工具 `grep`（harness 自有工具的示例）。"
inject = ["ga.tools"]

[settings.max_results]
type = "integer"
label = "Maximum results"
label_zh = "最大结果数"
default = 200
min = 1
max = 10000

[settings.root]
type = "string"
label = "Search root (blank uses working directory)"
label_zh = "搜索根目录（留空则用工作目录）"
default = ""
max_length = 1024

[settings.case]
type = "choice"
label = "Default case matching"
label_zh = "默认大小写匹配"
default = "sensitive"
description = "Used when the model does not pass ignore_case."
description_zh = "模型调用时未指定 ignore_case 时使用。"
options = [
  { value = "sensitive", label = "Case-sensitive", label_zh = "区分大小写" },
  { value = "insensitive", label = "Ignore case", label_zh = "忽略大小写" },
  { value = "smart", label = "Smart (ignore unless pattern has uppercase)", label_zh = "智能（模式含大写时才区分）" },
]

[settings.max_file_kb]
type = "integer"
label = "Skip files larger than (KB)"
label_zh = "跳过大于此大小的文件（KB）"
default = 2000
min = 1
max = 100000

[settings.skip_dirs]
type = "string"
label = "Extra directories to skip (comma-separated)"
label_zh = "额外跳过的目录（逗号分隔）"
default = ""
max_length = 1024
