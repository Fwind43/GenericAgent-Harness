<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ga-harness</title>
<script>try{var t=localStorage.getItem('gah-theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
<style>
/* Palettes follow GenericAgent-Admin (light / dark / warm). */
html[data-theme="light"]{--bg:#fff;--surface:#fff;--surface-muted:#f7f7f7;--border:#e5e5e5;--text:#0d0d0d;--muted:#6b6b6b;--accent:#373737;--on-accent:#fff;--code-bg:#f7f7f8;--danger:#c0392b;color-scheme:light}
html[data-theme="dark"]{--bg:#0d0f11;--surface:#1b1e22;--surface-muted:#24282e;--border:rgba(255,255,255,.15);--text:#ececec;--muted:#a6abb2;--accent:#19c39c;--on-accent:#06251d;--code-bg:#20242a;--danger:#ff7b72;color-scheme:dark}
html[data-theme="warm"]{--bg:#F4F0ED;--surface:#FCFAF8;--surface-muted:#EEE6E1;--border:#DED3CB;--text:#362F2B;--muted:#776A63;--accent:#995D4D;--on-accent:#fff;--code-bg:#EEE6E1;--danger:#a8322a;color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:10px 20px;border-bottom:1px solid var(--border);background:var(--bg)}
header h1{font-size:15px;font-weight:600;margin:0}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}
.dot.live{background:#19c39c}
#conn{font-size:12px;color:var(--muted)}
.spacer{flex:1}
select{font:inherit;font-size:13px;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:3px 8px}
main{flex:1;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
#thread{max-width:820px;margin:0 auto;padding:24px 20px 12px}
.empty{color:var(--muted);text-align:center;margin-top:18vh}
.empty b{display:block;color:var(--text);font-size:20px;font-weight:600;margin-bottom:6px}
.msg{margin:0 0 22px}
.msg.user{display:flex;justify-content:flex-end}
.msg.user .body{background:var(--surface-muted);border-radius:18px;padding:9px 15px;max-width:min(80%,640px)}
.meta{font-size:12px;color:var(--muted);margin-bottom:4px;display:flex;align-items:center;gap:6px}
.meta .dot{width:4px;height:4px;background:#19c39c}
.body{white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere}
.msg.assistant .body{font-family:inherit}
.usage{font-size:12px;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
.step>summary .tok{flex:none;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.status{font-size:12px;color:var(--muted);margin-top:6px}
.status.error{color:var(--danger)}
.cursor::after{content:"";display:inline-block;width:7px;height:1em;vertical-align:-2px;margin-left:2px;background:var(--muted);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
footer{padding:8px 20px 18px;background:var(--bg)}
form{max-width:820px;margin:0 auto;display:flex;gap:8px;align-items:flex-end;border:1px solid var(--border);background:var(--surface);border-radius:22px;padding:8px 8px 8px 16px}
form:focus-within{border-color:var(--muted)}
textarea{flex:1;border:0;outline:0;resize:none;background:transparent;color:var(--text);font:inherit;max-height:40vh;min-height:24px;padding:4px 0;scrollbar-width:thin}
textarea::placeholder{color:var(--muted)}
button{font:inherit;font-size:14px;border:0;border-radius:16px;padding:6px 16px;cursor:pointer;background:var(--accent);color:var(--on-accent)}
button:disabled{opacity:.4;cursor:default}
button.stop{background:transparent;color:var(--text);border:1px solid var(--border)}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.steps{margin:2px 0 8px;font-size:13px}
.steps>summary,.step>summary,.tool>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:6px;color:var(--muted);user-select:none}
.steps>summary::-webkit-details-marker,.step>summary::-webkit-details-marker,.tool>summary::-webkit-details-marker{display:none}
.chev{display:inline-block;width:10px;flex:none;transform:rotate(-90deg);transition:none}
details[open]>summary>.chev{transform:none}
.steps>summary:hover,.step>summary:hover{color:var(--text)}
.step{border-bottom:1px solid var(--border);padding:6px 0}
.step:last-child{border-bottom:0}
.step>summary .no{font-size:12px;color:var(--muted);flex:none}
.step>summary .ttl{color:var(--text);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.step>summary .cnt{font-size:12px;flex:none}
.step-body{padding:6px 0 2px 16px}
.step-body .reply{white-space:pre-wrap;word-break:break-word;margin:0 0 6px;color:var(--text)}
.tool{border:1px solid var(--border);border-radius:10px;background:var(--surface);margin:6px 0;overflow:hidden}
.tool>summary{padding:6px 10px;color:var(--text)}
.tool .tname{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12.5px;font-weight:600;flex:none}
.tool .targ{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px}
.tool .tst{flex:none;font-size:12px;color:var(--muted)}
.tool .tst.ok{color:#19a37f}.tool .tst.fail{color:var(--danger)}
.tool .tst.run::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--muted);margin-right:5px;vertical-align:1px;animation:blink 1s steps(1) infinite}
.tool-body{border-top:1px solid var(--border);padding:6px 10px 8px}
.tool-body .lbl{font-size:11px;color:var(--muted);margin:4px 0 2px}
.tool-body pre{margin:0;background:var(--code-bg);border-radius:6px;padding:6px 8px;font:12px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap;word-break:break-word;max-height:320px;overflow:auto;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.working{font-size:13px;color:var(--muted)}
.hint{max-width:820px;margin:6px auto 0;font-size:12px;color:var(--muted);text-align:center}
.toolbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:8px 20px;border-bottom:1px solid var(--border)}
.toolbar[hidden],#notice[hidden]{display:none}
.toolbar select{flex:1;min-width:80px;max-width:420px;padding:6px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);font:inherit;font-size:13px}
.secondary{background:var(--surface-muted);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:13px}
#notice{padding:8px 20px;color:var(--danger);font-size:13px;overflow-wrap:anywhere;border-bottom:1px solid var(--border)}
button:focus-visible,select:focus-visible{outline:2px solid var(--muted);outline-offset:2px}
@media (max-width:600px){.toolbar{padding:8px 12px;gap:4px}.toolbar select{max-width:none}.toolbar button{padding:6px 8px}header{padding:8px 12px}#thread{padding:16px 12px 8px}footer{padding:6px 10px 12px}.msg.user .body{max-width:88%}.hint{display:none}}

#models[hidden]{display:none}
#models label{font-size:12px;color:var(--muted)}
#model-dialog{width:min(680px,calc(100vw - 24px));max-height:calc(100dvh - 32px);margin:auto;padding:0;border:1px solid var(--border);border-radius:14px;background:var(--surface);color:var(--text);overflow:auto;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
#model-dialog::backdrop{background:rgba(0,0,0,.35)}
.dialog-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--border)}
.dialog-head h2{font-size:17px;margin:0;font-weight:600}
.dialog-content{padding:16px 20px 20px}
.model-picker{display:flex;gap:8px;margin-bottom:16px}.model-picker select{flex:1;min-width:0}
.model-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
.model-field{display:flex;flex-direction:column;gap:4px;min-width:0;font-size:13px}
.model-field.wide{grid-column:1/-1}
.model-field input,.model-field select{width:100%;min-width:0;border:1px solid var(--border);border-radius:8px;padding:8px 10px;font:inherit;background:var(--bg);color:var(--text)}
.model-field input:focus-visible{outline:2px solid var(--muted);outline-offset:2px}
.model-field input:disabled{opacity:.65}.model-field small,.model-help{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.model-help{margin:0 0 14px}.model-help[hidden],#model-error[hidden]{display:none}
#model-error{font-size:13px;color:var(--danger);overflow-wrap:anywhere;margin:12px 0}
.model-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
#model-save{border:1px solid var(--accent);border-radius:8px;padding:8px 14px;background:var(--accent);color:var(--on-accent);font-size:13px}
#model-remove{margin-right:auto;color:var(--danger)}
.secondary:hover:not(:disabled){background:var(--border)}button:disabled{cursor:default;opacity:.5}
@media(max-width:600px){.model-grid{grid-template-columns:1fr}.dialog-head{padding:12px 16px}.dialog-content{padding:12px 16px 16px}}

</style>
</head>
<body>
<header>
  <span class="dot" id="dot"></span><h1>ga-harness</h1><span id="conn">连接中…</span>
  <span class="spacer"></span>
  <select id="theme" aria-label="主题"><option value="light">浅色</option><option value="dark">深色</option><option value="warm">暖色</option></select>
</header>
<nav id="sessions" class="toolbar" aria-label="会话管理" hidden>
  <select id="session-select" aria-label="当前会话"></select>
  <button id="session-new" class="secondary">新会话</button>
  <button id="session-rename" class="secondary">重命名</button>
  <button id="session-delete" class="secondary">删除</button>
</nav>

<nav id="models" class="toolbar" aria-label="模型管理" hidden>
  <label for="model-select">模型</label><select id="model-select" aria-label="当前模型"></select>
  <button id="model-settings" class="secondary">模型配置</button>
</nav>
<dialog id="model-dialog" aria-labelledby="model-heading">
  <div class="dialog-head"><h2 id="model-heading">模型配置</h2><button id="model-close" class="secondary" type="button">关闭</button></div>
  <div class="dialog-content">
    <p class="model-help">配置保存在本机，不会回显已有的 API Key。保存成功后即时生效。</p>
    <div class="model-picker"><select id="model-entry" aria-label="选择配置"></select><button id="model-add" class="secondary" type="button">新增</button></div>
    <p id="model-reason" class="model-help" hidden></p>
    <form id="model-form">
      <div class="model-grid">
        <label class="model-field">协议<select id="model-protocol"><option value="oai">OpenAI compatible</option><option value="claude">Anthropic Claude</option></select></label>
        <label class="model-field">显示名称<input id="model-name" maxlength="120" autocomplete="off"></label>
        <label class="model-field wide">配置标识<input id="model-key" required pattern="[A-Za-z][A-Za-z0-9_]{0,99}" autocomplete="off"><small>标识需包含 oai 或 claude 及 config。已有配置的标识不可修改。</small></label>
        <label class="model-field">模型 ID<input id="model-id" required autocomplete="off" placeholder="gpt-4.1"></label>
        <label class="model-field">上下文窗口<input id="model-context" type="number" min="1024" step="1" placeholder="131072"></label>
        <label class="model-field wide">API Base URL<input id="model-base" required autocomplete="off" placeholder="https://api.openai.com/v1"><small>支持 ${ENV_NAME} 环境变量引用。</small></label>
        <label class="model-field wide">API Key<input id="model-secret" type="password" autocomplete="new-password"><small id="model-secret-hint"></small></label>
      </div>
      <p id="model-error" role="status" hidden></p>
      <div class="model-actions"><button id="model-remove" class="secondary" type="button">删除配置</button><button id="model-save" type="submit">保存并生效</button></div>
    </form>
  </div>
</dialog>

<div id="notice" role="status" hidden></div>
<main id="scroll"><div id="thread"></div></main>
<footer>
  <form id="form">
    <textarea id="input" rows="1" placeholder="给 GenericAgent 发消息…" autofocus></textarea>
    <button type="button" id="stop" class="stop" hidden>停止</button>
    <button type="submit" id="send">发送</button>
  </form>
  <div class="hint">Enter 发送 · Shift+Enter 换行 · 同一时间只运行一个任务</div>
</footer>
<script>
const $=id=>document.getElementById(id);
const thread=$('thread'),scroll=$('scroll'),input=$('input'),send=$('send'),stop=$('stop'),theme=$('theme');
let state={running:false,messages:[]};
theme.value=document.documentElement.dataset.theme;
theme.onchange=()=>{document.documentElement.dataset.theme=theme.value;try{localStorage.setItem('gah-theme',theme.value)}catch(e){}};
const STATUS={aborted:'已停止',error:'出错'};
function nearBottom(){return scroll.scrollHeight-scroll.scrollTop-scroll.clientHeight<80}
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
const opened=new Set();
function det(cls,key,dflt){const d=el('details',cls);d.open=opened.has(key)?true:opened.has('!'+key)?false:dflt;
  d.addEventListener('toggle',()=>{opened.delete(key);opened.delete('!'+key);opened.add(d.open?key:'!'+key)});return d}
function chev(){return el('span','chev','\u25BE')}
function argPreview(a){if(a==null)return '';if(typeof a!=='object')return String(a);
  const v=a.script||a.command||a.path||a.pattern||a.query||a.url;
  const s=typeof v==='string'?v:JSON.stringify(a);return s.split('\n').find(x=>x.trim())||s}
function fmt(a){if(a==null)return '';return typeof a==='string'?a:JSON.stringify(a,null,2)}
function renderTool(t,key){
  const d=det('tool',key,false),s=el('summary');
  let st;if(t.status!=='done')st=el('span','tst run','运行中');
  else st=el('span','tst '+(t.ok?'ok':'fail'),(t.ok?'\u2713':'\u2717')+(t.seconds!=null?' '+Number(t.seconds).toFixed(1)+'s':''));
  s.append(chev(),el('span','tname',t.name||'tool'),el('span','targ',argPreview(t.args)),st);d.append(s);
  const b=el('div','tool-body');
  if(t.args!=null){b.append(el('div','lbl','参数'),el('pre',null,fmt(t.args)))}
  if(t.status==='done'){b.append(el('div','lbl','结果'),el('pre',null,t.data||'(空)'))}
  d.append(b);return d}
function num(v){return Number(v||0).toLocaleString('en-US')}
function tok(u){if(!u)return'';let s='\u8f93\u5165 '+num(u.input);
  if(u.cache_read||u.cache_write)s+='\uff08\u7f13\u5b58\u547d\u4e2d '+num(u.cache_read)+(u.cache_write?' / \u5199\u5165 '+num(u.cache_write):'')+'\uff09';
  return s+' \u00b7 \u8f93\u51fa '+num(u.output)}
function renderStep(t,key,live){
  const d=det('step',key,live),s=el('summary');
  const title=t.summary||(t.reply||'').split('\n').find(x=>x.trim())||(t.tools.length?t.tools.map(x=>x.name).join(', '):'思考中…');
  s.append(chev(),el('span','no','步骤 '+t.turn),el('span','ttl',title));
  if(t.tools.length)s.append(el('span','cnt',t.tools.length+' 个工具'));
  if(t.usage)s.append(el('span','tok',num(t.usage.input)+' / '+num(t.usage.output)+' tok'));
  d.append(s);const b=el('div','step-body');
  if(t.reply&&t.tools.length)b.append(el('div','reply',t.reply));
  t.tools.forEach((x,j)=>b.append(renderTool(x,key+':'+(x.id||j))));
  d.append(b);return d}
function renderTurns(m,mi,box){
  const turns=m.turns.filter(Boolean),running=m.status==='running';
  const fin=turns[turns.length-1];
  // A tool-free last turn is the answer even after its own turn event lands and before the
  // run's done event; demoting it into the steps list in that gap makes the reply vanish.
  const finalT=fin&&!fin.tools.length&&fin.reply?fin:null;
  const streaming=running&&!!finalT;
  const steps=finalT?turns.slice(0,-1):turns;
  if(steps.length){const d=det('steps',mi+':steps',running),s=el('summary');
    s.append(chev(),el('span',null,(running?'执行中 · ':'执行过程 · ')+steps.length+' 步'));d.append(s);
    steps.forEach((t,j)=>d.append(renderStep(t,mi+':'+t.turn,running&&j===steps.length-1)));box.append(d)}
  if(finalT){const typing=streaming||(finalT._shown!=null&&finalT._shown<finalT.reply.length);
    const b=el('div','body'+(typing?' cursor':''),typing?finalT.reply.slice(0,finalT._shown||0):finalT.reply);
    if(typing){typer.el=b;typer.t=finalT;kickTyper()}box.append(b)}
  else if(running)box.append(el('div','body working cursor',''));
  else if(fin&&fin.reply)box.append(el('div','body',fin.reply));
}
function renderMsg(m,mi){
  const box=el('div','msg '+m.role);
  if(m.role==='assistant'){const meta=el('div','meta');meta.append(el('span','dot'),el('span',null,'GenericAgent'));box.append(meta)}
  if(m.role==='assistant'&&m.turns&&m.turns.length){renderTurns(m,mi,box)}
  else{const body=el('div','body',m.text);
    if(m.role==='assistant'&&m.status==='running'){body.classList.add('cursor');if(!m.text)body.textContent='';}
    box.append(body)}
  if(m.role==='assistant'&&m.usage&&m.usage.calls)box.append(el('div','usage','Token \u00b7 '+m.usage.calls+' \u6b21\u8c03\u7528 \u00b7 '+tok(m.usage)));
  if(m.status==='aborted'||m.status==='error'){box.append(el('div','status '+m.status,STATUS[m.status]+(m.error?'\uFF1A'+m.error:'')))}
  return box;
}
function render(){
  const stick=nearBottom();
  thread.replaceChildren();
  if(!state.messages.length){const e=el('div','empty');e.append(el('b',null,'有什么可以帮你？'),el('span',null,'任务交给本机 GenericAgent 执行'));thread.append(e)}
  state.messages.forEach((m,i)=>thread.append(renderMsg(m,i)));
  renderSessions();renderModels();syncControls();
  if(stick)scroll.scrollTop=scroll.scrollHeight;
}
let changing=false;
function notice(text){$('notice').textContent=text||'';$('notice').hidden=!text}
function renderSessions(){
  const entries=state.sessions;$('sessions').hidden=!Array.isArray(entries);
  if(entries){const s=$('session-select');s.replaceChildren();entries.forEach(x=>{const o=el('option',null,x.title);o.value=x.id;s.append(o)});s.value=state.session_id}
  if(state.persistence_error)notice(state.persistence_error);
}
function syncControls(){
  syncModelControls();
  stop.hidden=!state.running;send.disabled=state.running||changing||!input.value.trim();
  for(const id of ['session-select','session-new','session-rename','session-delete'])$(id).disabled=state.running||changing;
}
async function sessionAction(action,extra={}){
  changing=true;syncControls();notice('');
  try{state=await post('/api/sessions',{action,id:state.session_id,...extra});opened.clear();render();scroll.scrollTop=scroll.scrollHeight}
  catch(e){notice(e.message);renderSessions()}
  finally{changing=false;syncControls()}
}
$('session-select').onchange=e=>sessionAction('select',{id:e.target.value});
$('session-new').onclick=()=>sessionAction('new');
$('session-rename').onclick=()=>{const old=(state.sessions||[]).find(x=>x.id===state.session_id);const title=prompt('会话名称',old?.title||'');if(title!=null)sessionAction('rename',{title})};
$('session-delete').onclick=()=>{if(confirm('从会话列表中删除当前会话？记录将保留在本地数据库中。'))sessionAction('delete')};

let modelConfig=null,editingKey=null;
function renderModels(){
  const m=state.models;$('models').hidden=!m;
  if(!m)return;
  const sel=$('model-select');sel.replaceChildren();
  m.items.forEach(x=>{const o=el('option',null,x.name+(x.model&&x.name!==x.model?' / '+x.model:''));o.value=x.id;sel.append(o)});
  sel.value=m.current==null?'':String(m.current);
}
function modelError(text){$('model-error').textContent=text||'';$('model-error').hidden=!text}
function syncModelControls(){
  const busy=state.running||changing,locked=busy||!modelConfig?.writable;
  $('model-select').disabled=busy||!state.models?.items.length;
  $('model-settings').disabled=busy;
  for(const id of ['model-entry','model-add','model-save','model-name','model-id','model-context','model-base','model-secret'])$(id).disabled=locked;
  $('model-key').disabled=locked||editingKey!==null;$('model-protocol').disabled=locked||editingKey!==null;
  $('model-remove').disabled=locked||editingKey===null;
  $('model-close').disabled=changing;
}
function fillModel(key){
  const entry=modelConfig?.entries.find(x=>x.key===key),v=entry?.values||{};editingKey=entry?.key||null;
  $('model-entry').value=editingKey||'';
  $('model-protocol').value=editingKey?.includes('claude')?'claude':'oai';
  $('model-key').value=editingKey||'native_oai_config_'+Date.now();
  for(const [id,k] of [['model-name','name'],['model-id','model'],['model-base','apibase'],['model-context','context_win']])$(id).value=v[k]??'';
  $('model-secret').value='';$('model-secret').required=!entry?.has_key;
  $('model-secret').placeholder=entry?.has_key?'******':'';
  $('model-secret-hint').textContent=entry?.has_key?'留空保留原密钥或环境变量引用。':'填写密钥或 ${ENV_NAME}。';
  modelError(entry?.url_hidden?'原 URL 含敏感信息已隐藏，请重新填写不含密钥的 URL。':'');syncModelControls();
}
function fillModelConfig(preferred){
  const select=$('model-entry');select.replaceChildren(el('option',null,'新增配置'));select.firstChild.value='';
  modelConfig.entries.forEach(x=>{const o=el('option',null,x.values.name||x.values.model||x.key);o.value=x.key;select.append(o)});
  $('model-reason').textContent=modelConfig.reason||'';$('model-reason').hidden=modelConfig.writable;
  fillModel(preferred===null?null:(modelConfig.entries.some(x=>x.key===preferred)?preferred:modelConfig.entries[0]?.key));
}
$('model-select').onchange=async e=>{
  const id=Number(e.target.value);changing=true;syncControls();notice('');
  try{state=await post('/api/models/select',{id});render()}catch(err){notice(err.message);renderModels()}
  finally{changing=false;syncControls()}
};
$('model-settings').onclick=async()=>{
  modelConfig=null;editingKey=null;changing=true;syncControls();modelError('');$('model-secret').value='';$('model-dialog').showModal();
  try{const r=await fetch('/api/models/config');const d=await r.json();if(!r.ok)throw new Error(d.error||r.status);modelConfig=d;fillModelConfig()}
  catch(e){modelError(e.message)}finally{changing=false;syncControls()}
};
$('model-close').onclick=()=>$('model-dialog').close();
$('model-dialog').oncancel=e=>{if(changing)e.preventDefault()};
$('model-dialog').onclose=()=>{$('model-secret').value=''};
$('model-entry').onchange=e=>fillModel(e.target.value);
$('model-add').onclick=()=>{fillModel(null);$('model-name').focus()};
$('model-protocol').onchange=e=>{if(editingKey===null)$('model-key').value='native_'+e.target.value+'_config_'+Date.now()};
async function changeModel(action){
  if(changing||state.running||!modelConfig?.writable)return;
  const key=$('model-key').value.trim(),body={action,key,revision:modelConfig.revision};
  if(action==='save'){
    body.values={name:$('model-name').value.trim(),model:$('model-id').value.trim(),apibase:$('model-base').value.trim(),apikey:$('model-secret').value};
    if($('model-context').value)body.values.context_win=Number($('model-context').value);
  }
  changing=true;syncControls();modelError('');
  try{const d=await post('/api/models/config',body);state=d.state;modelConfig=d.config;fillModelConfig(action==='save'?key:undefined);render();modelError('');notice('模型配置已保存并生效')}
  catch(e){modelError(e.message)}finally{changing=false;syncControls()}
}
$('model-form').onsubmit=e=>{e.preventDefault();changeModel('save')};
$('model-remove').onclick=()=>{if(confirm('删除此模型配置？至少需保留一个模型。'))changeModel('delete')};

// Upstream models deliver text in bursts (often 5-25 chars every ~120ms). Revealing each
// burst at once looks jerky, so the visible reply chases the received text at a rate
// proportional to the backlog: smooth per-frame typing that never lags more than ~0.2s.
const typer={el:null,t:null,raf:0,ts:0};
function kickTyper(){if(!typer.raf)typer.raf=requestAnimationFrame(typeTick)}
function typeTick(now){typer.raf=0;const t=typer.t,b=typer.el;
  if(!t||!b||!b.isConnected){typer.ts=0;return}
  const full=t.reply||'';let n=Math.min(t._shown||0,full.length);
  const dt=typer.ts?Math.min(64,now-typer.ts):16;typer.ts=now;
  if(n<full.length){n=Math.min(full.length,n+Math.max(1,Math.ceil((full.length-n)*dt/180)));t._shown=n;
    const stick=nearBottom();b.textContent=full.slice(0,n);if(stick)scroll.scrollTop=scroll.scrollHeight}
  if(n<full.length)kickTyper();
  else{typer.ts=0;if(last()&&last().status!=='running')b.classList.remove('cursor')}}
let pending=0;function schedule(){if(!pending)pending=requestAnimationFrame(()=>{pending=0;render()})}
function last(){return state.messages[state.messages.length-1]}
function connect(){
  const es=new EventSource('/api/events');
  es.onopen=()=>{$('conn').textContent='已连接';$('dot').classList.add('live')};
  es.onerror=()=>{$('conn').textContent='已断开，重连中…';$('dot').classList.remove('live')};
  es.addEventListener('snapshot',e=>{state=JSON.parse(e.data);render()});
  es.addEventListener('start',e=>{const d=JSON.parse(e.data);state.running=true;
    state.messages.push({role:'user',text:d.task,status:'done'},{role:'assistant',text:'',status:'running'});render()});
  es.addEventListener('chunk',e=>{const m=last();if(!m||m.role!=='assistant')return;const stick=nearBottom();
    m.text+=JSON.parse(e.data).text;if(m.turns&&m.turns.length)return;const b=thread.lastElementChild&&thread.lastElementChild.querySelector('.body');
    if(b)b.textContent=m.text;else render();if(stick)scroll.scrollTop=scroll.scrollHeight});
  es.addEventListener('turn',e=>{const d=JSON.parse(e.data),m=last();if(!m||m.role!=='assistant')return;
    const ts=m.turns=m.turns||[],prev=ts[d.index];if(prev&&prev._shown!=null&&d.turn&&(d.turn.reply||'').startsWith((prev.reply||'').slice(0,prev._shown)))d.turn._shown=prev._shown;
    ts[d.index]=d.turn;render()});
  es.addEventListener('delta',e=>{const d=JSON.parse(e.data),m=last();if(!m||m.role!=='assistant')return;
    const ts=m.turns=m.turns||[];const t=ts[d.index]||(ts[d.index]={turn:d.turn,summary:'',reply:'',status:'running',tools:[]});
    t[d.part]=(t[d.part]||'')+d.text;schedule()});
  es.addEventListener('usage',e=>{const m=last();if(!m||m.role!=='assistant')return;m.usage=JSON.parse(e.data);render()});
  es.addEventListener('done',e=>{const d=JSON.parse(e.data),m=last();state.running=false;
    if(m&&m.role==='assistant'){m.status=d.status;if(d.error)m.error=d.error}render()});
}
async function post(path,body){
  const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})});
  if(!r.ok){let msg=r.status;try{msg=(await r.json()).error||msg}catch(e){}throw new Error(msg)}
  return r.json();
}
$('form').onsubmit=async e=>{
  e.preventDefault();const task=input.value.trim();if(!task||state.running||changing)return;
  send.disabled=true;
  try{await post('/api/run',{task});input.value='';grow()}catch(err){alert('发送失败：'+err.message)}
  syncControls();input.focus();
};
stop.onclick=async()=>{stop.disabled=true;try{await post('/api/abort')}catch(e){}stop.disabled=false};
function grow(){input.style.height='auto';input.style.height=input.scrollHeight+'px'}
input.oninput=()=>{grow();syncControls()};
input.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();$('form').requestSubmit()}};
render();connect();
</script>
