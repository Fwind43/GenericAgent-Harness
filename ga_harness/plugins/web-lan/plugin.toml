name = "web-lan"
category = "service"
entry = "main:apply"
description = "LAN access: forwards this machine's LAN IPv4 to the local web UI for phones/computers on the same network (token required, private peers only), with QR entry link and token reset."
description_zh = "局域网访问：把本机局域网 IPv4 端口转发到本地网页界面，供同一网络的手机/电脑访问（强制 token，仅放行内网地址），提供二维码入口链接和重置 token。"
inject = ["web.host"]

[settings.port]
type = "integer"
default = 8765
label = "LAN port"
label_zh = "局域网端口"
description = "Port opened on the LAN IP and forwarded to the web UI, which itself stays on 127.0.0.1 with a random port."
description_zh = "在局域网 IP 上监听并转发到网页界面的端口；网页界面本身只在 127.0.0.1 的随机端口上监听。"

[settings.bind]
type = "string"
default = ""
label = "Bind address"
label_zh = "绑定地址"
description = "Fixed LAN IPv4 to listen on, or 0.0.0.0 for all interfaces (peers are still limited to private addresses); empty = pick in the panel."
description_zh = "固定监听的局域网 IPv4，或 0.0.0.0 表示所有网卡（仍只放行内网地址）；留空则在面板中选择。"
