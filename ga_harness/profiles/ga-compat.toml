# Drop-in GA: unmodified GenericAgent + hook bridge. Everything else layers on top via patches.
# Models come from GA's own mykey.py (edited in place by model-store).
# ga-stdout comes first: GA's own print() output becomes `agent.log` events
# instead of hitting the terminal; frontends write to the `console` capability.
[[plugins]]
name = "plugin-manager"

[[plugins]]
name = "ga-stdout"

[[plugins]]
name = "ga-hooks"

# per-tool timing (tool.timed events); stderr echo off by default
[[plugins]]
name = "ga-timing"
config = { print = false }

# structured run/turn/tool events for frontends (no parsing of GA's display text)
[[plugins]]
name = "ga-events"

# token usage per LLM call / per run (usage, usage.total events)
[[plugins]]
name = "ga-usage"

# files changed by file_write/file_patch in each run, listed in the transcript at the end
[[plugins]]
name = "ga-file-changes"

[[plugins]]
name = "ga-core"

# system prompt / tool set overrides (no-op until configured)
[[plugins]]
name = "ga-prompt"

[[plugins]]
name = "ga-tools"

[[plugins]]
name = "session-store"

[[plugins]]
name = "workspace-store"

# Layered project memory (L0-L3 memory/ dir) injected into the system prompt for the active GA project
[[plugins]]
name = "project-memory"

[[plugins]]
name = "model-store"

# chat-platform bridge (bind external chats to sessions) + Feishu/Lark (needs lark-oapi) and WeChat providers
[[plugins]]
name = "channels"

[[plugins]]
name = "feishu"

[[plugins]]
name = "weixin"

# web page themes; an add-on for ui-web (dormant under other frontends)
[[plugins]]
name = "web-theme"
# web session bar / model picker+config / plugin manager; add-ons for ui-web
[[plugins]]
name = "web-sessions"

[[plugins]]
name = "web-models"

[[plugins]]
name = "web-plugins"


[[plugins]]
name = "web-workspaces"

# channel management dialog; add-on for ui-web
[[plugins]]
name = "web-channels"

# session "Trace" view: timeline of inputs, model calls, tool calls and timings
[[plugins]]
name = "web-trace"

# "Context" view: the saved LLM context of the chat (messages by block type, working memory)
[[plugins]]
name = "web-context"

# "Usage" page under New chat: token totals by day, model and chat
[[plugins]]
name = "web-usage"

# Settings page that imports GA Admin chats as continuable sessions (Admin files are only read)
[[plugins]]
name = "admin-import"

# render ```mermaid blocks in messages as diagrams; add-on for ui-web
[[plugins]]
name = "web-mermaid"

# desktop dynamic island page (floating task pill); only the desktop shell loads it
[[plugins]]
name = "desktop-island"

# per-message edit/regenerate and branch switching; add-on for ui-web
[[plugins]]
name = "worldline"

# queue messages sent while a task runs; edit/cancel/steer (non-interrupting injection via ga-steer)
[[plugins]]
name = "run-queue"

# conductor mode: a session plans/delegates to child task sessions (toggled per session,
# from the web UI or a chat's /conductor command)
[[plugins]]
name = "conductor"

# vision_ask tool: send local images to the current model or a mykey.py model
[[plugins]]
name = "vlm-tool"
