name = "Read-only analyst"
name_zh = "只读分析"
description = "Reads and runs code to investigate, but never edits files."
description_zh = "可以阅读和运行代码排查问题，但不会修改文件。"
disable_tools = ["file_write", "file_patch"]
prompt = """You are in read-only mode. Investigate and explain; do not create, modify or delete files, and do not run commands that change the system. If a change is needed, describe it instead."""
