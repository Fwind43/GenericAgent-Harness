name: desktop

# Builds the Electron desktop app for Windows, macOS (arm64 + x64) and Linux.
# Every run uploads unsigned installers as artifacts; a "v*" tag (e.g. v0.2.0) also creates a
# draft release. The release carries, besides the installers:
#   update.json + ga-harness-app-<version>.zip   code-only update read by desktop/src/updater.js
#   latest.yml / latest-linux.yml + *.blockmap   installer update (electron-updater, generic feed)
# Bump desktop/MIN_SHELL when a release needs a newer desktop shell; otherwise desktop users
# only download the small code package.
on:
  push:
    branches: [main, desktop]
    tags: ["v*"]
    paths:
      - "desktop/**"
      - "frontend/**"
      - "ga_harness/**"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "desktop/**"
      - "frontend/**"
      - "ga_harness/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, runner: windows-latest, target: --win, arch: --x64 }
          - { name: macos-arm64, runner: macos-14, target: --mac, arch: --arm64 }
          - { name: macos-x64, runner: macos-15-intel, target: --mac, arch: --x64 }
          - { name: linux-x64, runner: ubuntu-22.04, target: --linux, arch: --x64 }
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"   # unsigned until signing secrets exist
      GAH_DESKTOP_PYTHON_VERSION: "3.12"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - uses: astral-sh/setup-uv@v6

      - name: Build web frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: node desktop/scripts/set-version.mjs "${{ github.ref_name }}"

      - name: Check shell sources
        working-directory: desktop
        run: npm run check

      - name: Stage Python runtime and backend
        working-directory: desktop
        run: node scripts/prepare.mjs

      - name: Package
        working-directory: desktop
        run: npx electron-builder ${{ matrix.target }} ${{ matrix.arch }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          if-no-files-found: error
          path: |
            desktop/dist/*.exe
            desktop/dist/*.zip
            desktop/dist/*.dmg
            desktop/dist/*.AppImage
            desktop/dist/*.tar.gz
            desktop/dist/*.blockmap
            desktop/dist/latest.yml
            desktop/dist/latest-linux.yml

  # Code-only update package (platform independent: ga_harness incl. ui-web dist and plugins).
  app:
    name: app-bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: node desktop/scripts/set-version.mjs "${{ github.ref_name }}"

      - name: Build web frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build code package and update.json
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' ga_harness/__init__.py)
          python3 desktop/scripts/app_bundle.py "$version" out

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-app
          if-no-files-found: error
          path: |
            out/update.json
            out/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          pattern: desktop-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          draft: true
          generate_release_notes: true
