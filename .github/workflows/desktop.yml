name: desktop

# Temporary diagnostic build only: no Release, tag, update manifest or container publication.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Build a new package or verify the already-delivered DMG
        type: choice
        options: [build, runtime]
        default: build

permissions:
  contents: read
  actions: read

jobs:
  build:
    if: inputs.mode != 'runtime'
    name: macos-arm64-dockfix
    runs-on: macos-15
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      GAH_DESKTOP_PYTHON_VERSION: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json
      - uses: astral-sh/setup-uv@v6
      - name: Build web frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Stamp temporary version
        run: node desktop/scripts/set-version.mjs 0.0.46-dockfix.1
      - name: Check shell sources
        working-directory: desktop
        run: npm run check
      - name: Stage Python runtime and backend
        working-directory: desktop
        run: node scripts/prepare.mjs
      - name: Package arm64
        working-directory: desktop
        run: npx electron-builder --mac --arm64 --publish never
      - name: Verify package and write checksums
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib, plistlib, struct
          app = pathlib.Path('desktop/dist/mac-arm64/ga-harness-desktop.app')
          info = plistlib.loads((app / 'Contents/Info.plist').read_bytes())
          assert info['CFBundleIdentifier'] == 'io.github.fwind43.ga-harness', info
          assert info['CFBundleShortVersionString'] == '0.0.46-dockfix.1', info
          assert not info.get('LSUIElement') and not info.get('LSBackgroundOnly'), info
          data = (app / 'Contents/Resources/app.asar').read_bytes()
          header_size, json_size = struct.unpack_from('<I', data, 4)[0], struct.unpack_from('<I', data, 12)[0]
          header = json.loads(data[16:16 + json_size])
          def read_asar(path):
              entry = header
              for part in path.split('/'):
                  entry = entry['files'][part]
              start = 8 + header_size + int(entry['offset'])
              return data[start:start + entry['size']].decode('utf-8')
          main = read_asar('src/main.js')
          auto = read_asar('src/autostart.js')
          assert "app.setActivationPolicy('regular')" in main
          assert 'app.dock.show()' in main and main.count('ensureDockIcon();') == 2
          assert 'openAsHidden: true' not in auto
          assert json.loads(read_asar('package.json'))['version'] == '0.0.46-dockfix.1'
          print('Verified packaged version, foreground plist, Dock fix and login settings.')
          PY
          hdiutil verify desktop/dist/*.dmg
          cp desktop/TEMP-DOCKFIX.md desktop/dist/README-临时包.md
          cd desktop/dist
          shasum -a 256 *.dmg > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ga-harness-0.0.46-dockfix.1-macos-arm64
          retention-days: 14
          if-no-files-found: error
          path: |
            desktop/dist/*.dmg
            desktop/dist/SHA256SUMS.txt
            desktop/dist/README-临时包.md

  runtime:
    if: inputs.mode == 'runtime'
    name: macos-arm64-runtime
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download the original delivered artifact
        uses: actions/download-artifact@v4
        with:
          name: ga-harness-0.0.46-dockfix.1-macos-arm64
          run-id: 44003394550
          github-token: ${{ github.token }}
          path: delivered
      - name: Verify and install the original DMG
        shell: bash
        run: |
          set -euo pipefail
          cd delivered
          shasum -a 256 -c SHA256SUMS.txt
          MOUNT="$RUNNER_TEMP/dockfix-mount"
          mkdir -p "$MOUNT"
          hdiutil attach ./*.dmg -readonly -nobrowse -mountpoint "$MOUNT"
          APP=("$MOUNT"/*.app)
          DEST="/Applications/$(basename "${APP[0]}")"
          sudo ditto "${APP[0]}" "$DEST"
          hdiutil detach "$MOUNT"
          echo "DOCKFIX_APP=$DEST" >> "$GITHUB_ENV"
          /System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister -f "$DEST"
      - name: Launch real application and verify Dock recovery
        run: node desktop/scripts/verify-dock-runtime.mjs "$DOCKFIX_APP" runtime-evidence
      - name: Preserve runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-dockfix-runtime-evidence
          path: runtime-evidence
          if-no-files-found: warn
          retention-days: 14
